{% extends "base.html" %}
{% block title %}编辑车源 #{{ car.id }}<script>
  // 选好品牌后, 把车系下拉收窄成该品牌的 (数据来自静态对照表, 不查数据库)
  const SERIES_BY_BRAND = {{ series_by_brand|tojson }};
  const brandInput = document.getElementById("brand-input");
  const seriesInput = document.getElementById("series-input");
  const seriesList = document.getElementById("series-options");

  function refillSeries() {
    const list = SERIES_BY_BRAND[brandInput.value.trim()];
    if (!list) return;
    seriesList.innerHTML = list.map((s) => '<option value="' + s + '">').join("");
    const current = seriesInput.value.trim();
    if (current && !list.includes(current)) seriesInput.value = "";
  }

  brandInput.addEventListener("input", refillSeries);
  brandInput.addEventListener("change", refillSeries);
  refillSeries();
</script>

{% endblock %}
{% block content %}

<datalist id="brand-options">{% for b in brands %}<option value="{{ b }}">{% endfor %}</datalist>
<datalist id="series-options">{% for s in series %}<option value="{{ s }}">{% endfor %}</datalist>

<section class="card">
  <h2>编辑车源 #{{ car.id }}</h2>
  <form class="grid" method="post" action="/cars/{{ car.id }}/edit">
    <label>品牌 *<input type="text" name="brand" id="brand-input" list="brand-options" required maxlength="50" value="{{ car.brand }}"></label>
    <label>车系 *<input type="text" name="series" id="series-input" list="series-options" required maxlength="80" value="{{ car.series }}"></label>
    <label>车龄(年) *<input type="number" name="car_age_years" required min="0" max="50" step="0.1" value="{{ car.car_age_years }}"></label>
    <label>表显里程(万公里) *<input type="number" name="mileage_wan" required min="0" max="100" step="0.01" value="{{ car.mileage_wan }}"></label>

    <label>0次过户
      <select name="zero_transfer">
        <option value="0"{% if not car.zero_transfer %} selected{% endif %}>否</option>
        <option value="1"{% if car.zero_transfer %} selected{% endif %}>是</option>
      </select>
    </label>
    <label>原厂质保
      <select name="factory_warranty">
        <option value="0"{% if not car.factory_warranty %} selected{% endif %}>否</option>
        <option value="1"{% if car.factory_warranty %} selected{% endif %}>是</option>
      </select>
    </label>
    <label>准新车
      <select name="near_new">
        <option value="0"{% if not car.near_new %} selected{% endif %}>否</option>
        <option value="1"{% if car.near_new %} selected{% endif %}>是</option>
      </select>
    </label>

    <div class="actions wide">
      <button type="submit" class="primary">保存修改</button>
      <a class="button ghost" href="/">返回</a>
    </div>
  </form>
</section>

{% endblock %}
