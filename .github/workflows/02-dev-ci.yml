name: 02 · dev 集成校验

# 负责 PR -> staging 这一环: lint + 全量测试 + 构建镜像(课程对 PR 的三项要求)。
# dev 是集成分支, push 上来同样跑全量。
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 全量测试 + 静态检查 + 构建镜像
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: car_predict_test
          MYSQL_USER: carpredict
          MYSQL_PASSWORD: carpredict
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      AUTO_CREATE_TABLES: "0"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: carpredict
      DB_PASSWORD: carpredict
      DB_NAME: car_predict_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装开发依赖
        run: pip install -r requirements-dev.txt

      - name: 静态检查 (ruff)
        run: ruff check app tests ml

      - name: 构建镜像(验证 Dockerfile 能过)
        run: docker build -t car-predict:ci .

      - name: 全量测试
        run: pytest -q tests
