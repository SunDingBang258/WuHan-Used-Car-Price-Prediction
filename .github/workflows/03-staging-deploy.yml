name: 03 · staging 部署与冒烟

# staging 是预发布环境: 在这里构建真实镜像、起真实 MySQL + 应用,
# 再用 HTTP 打真实服务做基本检查。staging 通过才允许合入 main。
on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  build-and-smoke:
    name: 构建镜像 → 起服务 → 测试
    runs-on: ubuntu-latest
    environment: staging

    # 冒烟测试里的 pytest 跑在 runner 上(不是容器内), 所以必须自己给 DB 配置。
    # 注意端口是 13306 —— docker-compose 把 mysql 的 3306 映射到宿主机 13306,
    # 应用容器内部才用 DB_HOST=mysql:3306。
    # 用户名/密码要和 docker-compose.yml 里 MYSQL_* 的默认值一致。
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "13306"
      DB_USER: carpredict
      DB_PASSWORD: carpredict
      DB_NAME: car_predict
      DB_CHARSET: utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt

      # 课程要求的流程: 用 staging 环境的专属 secrets 生成 staging .env, 再构建镜像。
      # 这些 secret 配在 Settings → Environments → staging 下(不是仓库级)。
      # 没配时会写出空值, compose 会退回 docker-compose.yml 里的默认值, 不影响本地冒烟。
      - name: 用 staging secrets 生成 .env
        run: |
          cat > .env <<EOF
          APP_NAME=武汉二手车价格预测(staging)
          DEBUG=false
          AUTO_CREATE_TABLES=true
          DB_HOST=127.0.0.1
          DB_PORT=13306
          DB_USER=${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          DB_NAME=${{ secrets.STAGING_DB_NAME }}
          DB_CHARSET=utf8mb4
          MYSQL_ROOT_PASSWORD=${{ secrets.STAGING_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.STAGING_DB_NAME }}
          MYSQL_USER=${{ secrets.STAGING_DB_USER }}
          MYSQL_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          EOF
          echo "staging .env 已生成($(wc -l < .env) 行), 内容不打印"

      - name: 构建并启动 MySQL + 应用
        run: docker compose up -d --build

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "应用已就绪"; exit 0
            fi
            echo "第 $i 次等待..."
            sleep 3
          done
          echo "应用始终未就绪"
          docker compose logs --tail=200
          exit 1

      # curl 在验证容器;
      # 下面那个 pytest 是进程内测试, 验证的是代码本身。
      - name: 检查数据库连通性(真实容器)
        run: curl -fsS http://127.0.0.1:8000/api/health/db

      - name: 冒烟测试
        run: pytest -q tests/stage_staging

      - name: 失败时打印容器日志
        if: failure()
        run: docker compose logs --tail=200

      - name: 清理容器
        if: always()
        run: docker compose down -v
