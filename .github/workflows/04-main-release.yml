name: 04 · main 发布

# main 是主分支: 合入即做全量回归; 打 v* 标签则构建并推送镜像 + 发 Release;
# 推送到 main 还会走一次生产部署(environment: production 可设为需要人工审批)。
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 发布前全量回归
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: car_predict_test
          MYSQL_USER: carpredict
          MYSQL_PASSWORD: carpredict
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      AUTO_CREATE_TABLES: "0"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: carpredict
      DB_PASSWORD: carpredict
      DB_NAME: car_predict_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装开发依赖
        run: pip install -r requirements-dev.txt

      - name: 代码风格
        run: ruff check app tests

      - name: 全量测试
        run: |
          pytest -q \
            tests/test_database_config.py \
            tests/test_crud.py \
            tests/test_health.py \
            tests/test_cars_api.py \
            tests/test_cars_pages.py \
            tests/test_mysql_integration.py \
            --cov=app --cov-report=term-missing --cov-fail-under=85

  build-and-push:
    name: 构建并推送镜像 (ghcr.io)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: 创建 GitHub Release
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            镜像: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            ## 本次内容
            - 参数录入服务的 FastAPI 后台 + HTML 页面
            - 全量测试已在 MySQL 上通过

  deploy-production:
    name: 部署到生产(需人工审批)
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://car-predict.example.com
    steps:
      - uses: actions/checkout@v4
      - name: 部署(占位, 请接入真实部署方式)
        run: |
          echo "TODO: 在这里接入真实部署(SSH / K8s / 云平台 CLI 等)"
          echo "待部署版本: ${{ github.sha }}"
