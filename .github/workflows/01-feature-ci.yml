name: 01 · feature 快速校验

# 课程要求(CI): PR 到受保护分支(dev/staging/main)时必须
#   ① 跑全量测试  ② 跑 lint/静态检查  ③ 构建 Docker 镜像且不报错
# 本文件负责 PR -> dev 这一环。
#
# push 到 feature/** 时只跑数据层子集, 追求快速反馈;
# pull_request 时跑全量 —— 见「跑测试」那一步的 if 分支。
on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: 数据层测试
    runs-on: ubuntu-latest

    # 数据库在 workflow 里配置好; health-cmd 保证步骤开始时 MySQL 已可用
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: car_predict_test
          MYSQL_USER: carpredict
          MYSQL_PASSWORD: carpredict
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      AUTO_CREATE_TABLES: "0"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: carpredict
      DB_PASSWORD: carpredict
      DB_NAME: car_predict_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装开发依赖
        run: pip install -r requirements-dev.txt

      - name: 静态检查 (ruff)
        run: ruff check app tests ml

      - name: 构建镜像(验证 Dockerfile 能过)
        run: docker build -t car-predict:ci .

      # PR 到 dev 是受保护分支的合并前检查, 课程要求跑全量;
      # push 到 feature 只是开发期反馈, 跑子集就够。
      - name: 跑测试
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pytest -q tests
          else
            pytest -q tests/stage_feature
          fi
