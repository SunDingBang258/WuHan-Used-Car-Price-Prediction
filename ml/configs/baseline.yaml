# 基线模型 —— 对照组
#
# 用 sklearn 的默认超参, 并且**不用**任何目标编码特征(折价率/车系中位价)。
# 目的: 回答"没有查表特征 + 没调参能到多少分", 作为 tuned 的参照。
#
# 怎么用: 把 ml/train.py 顶部的 CONFIG_PATH 指向这个文件, 然后 python ml/train.py
name: baseline
description: "HistGradientBoosting 默认超参, 只用原始特征(不含折价率/车系中位价)"

# 数据集(DVC 管理, 路径相对仓库根)。v2 = 做过去重/清洗/车系归一化/组过滤的最终版本。
# 想用 v1 对比就改成 data/che168_wuhan_cars_v1.csv (3408 条, 未做归一化和组过滤)
dataset: data/che168_wuhan_cars.csv

use_lookups: false      # 关键差异: 不启用目标编码特征
loss: squared_error
learning_rate: 0.1
max_iter: 100
max_leaf_nodes: 31
min_samples_leaf: 20
l2_regularization: 0.0

save_to_app: false      # 不覆盖 app/model.joblib
