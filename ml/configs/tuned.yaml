# 调优模型 —— 生产版本
# 相比 baseline 两处改动:
#   1. 启用三个目标编码特征(品牌折价率 / 车系折价率 / 车系中位价), 折内重算防泄漏
#   2. loss 换成 absolute_error, 并针对售价跨 3 个数量级调了学习率与树规模
name: tuned
description: "加入品牌/车系折价率与车系中位价, loss=absolute_error, 调整学习率与树规模"

use_lookups: true
loss: absolute_error
learning_rate: 0.06
max_iter: 400
max_leaf_nodes: 31
min_samples_leaf: 20
l2_regularization: 1.0

save_to_app: true       # 训练完覆盖 app/model.joblib, 供应用推理
